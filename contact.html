<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hubungi Kami | Lampung Commodity Hub</title>
<meta name="description" content="Hubungi Lampung Commodity Hub untuk informasi komoditas Lampung.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: {
      brand: { 50:'#f0fdf4',100:'#dcfce7',700:'#15803d',800:'#166534',900:'#14532d',950:'#052e16' },
      gold: { 400:'#fbbf24',500:'#f59e0b' }
    },
    fontFamily:{ sans:['Inter','sans-serif'], display:['Poppins','sans-serif'] },
    boxShadow:{ soft:'0 6px 24px -8px rgba(15,23,42,.12)' }
  }}
}
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-white font-sans text-slate-700 antialiased">

<header class="sticky top-0 z-50 border-b border-slate-100 bg-white/90 backdrop-blur">
  <nav class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6 lg:px-8">
    <a href="index.html" class="flex items-center gap-2">
      <span class="grid h-10 w-10 place-items-center rounded-xl bg-brand-800 text-gold-400"><i class="fa-solid fa-seedling"></i></span>
      <span class="font-display text-sm font-bold text-brand-900 sm:text-base">Lampung Commodity Hub</span>
    </a>
    <button id="navToggle" class="grid h-10 w-10 place-items-center rounded-lg hover:bg-slate-100 lg:hidden" aria-label="Menu">
      <i class="fa-solid fa-bars"></i>
    </button>
    <ul id="navMenu" class="absolute left-0 right-0 top-full hidden flex-col gap-1 border-b border-slate-100 bg-white p-4 shadow-soft lg:static lg:flex lg:flex-row lg:items-center lg:border-0 lg:bg-transparent lg:p-0 lg:shadow-none">
      <li><a class="nav-link" href="index.html">Home</a></li>
      <li><a class="nav-link" href="about.html">Tentang</a></li>
      <li><a class="nav-link" href="commodities.html">Komoditas</a></li>
      <li><a class="nav-link" href="contact.html">Contact</a></li>
      <li id="navAuth" class="mt-2 flex gap-2 lg:mt-0 lg:ml-2"></li>
    </ul>
  </nav>
</header>

<main class="mx-auto max-w-6xl px-4 py-14 sm:px-6 lg:px-8">
  <span class="text-xs font-bold uppercase tracking-widest text-brand-700">Kontak</span>
  <h1 class="mt-3 font-display text-3xl font-bold text-slate-900 sm:text-4xl">Hubungi Kami</h1>
  <p class="mt-3 max-w-2xl text-slate-600">Sampaikan pertanyaan, permintaan informasi komoditas, atau peluang kerja sama.</p>

  <div class="mt-10 grid gap-6 lg:grid-cols-2">
    <div id="contactCard" class="rounded-3xl bg-white p-6 shadow-soft ring-1 ring-slate-100 sm:p-8">
      <p class="text-slate-400">Memuat…</p>
    </div>

    <form id="contactForm" class="rounded-3xl bg-white p-6 shadow-soft ring-1 ring-slate-100 sm:p-8">
      <h2 class="font-display text-xl font-bold text-slate-900">Kirim Pesan</h2>
      <div class="mt-5 space-y-4">
        <div>
          <label class="form-label" for="cname">Nama</label>
          <input id="cname" required class="form-input" placeholder="Nama Anda">
        </div>
        <div>
          <label class="form-label" for="cemail">Email</label>
          <input id="cemail" type="email" required class="form-input" placeholder="email@domain.com">
        </div>
        <div>
          <label class="form-label" for="cmessage">Pesan</label>
          <textarea id="cmessage" required rows="4" class="form-input" placeholder="Tulis pesan Anda…"></textarea>
        </div>
        <div id="cmsg" class="hidden rounded-xl px-4 py-3 text-sm"></div>
        <button type="submit" class="w-full rounded-xl bg-brand-800 py-3 text-sm font-semibold text-white hover:bg-brand-900 disabled:opacity-60">
          <i class="fa-solid fa-paper-plane mr-1"></i> Kirim Pesan
        </button>
      </div>
    </form>
  </div>
</main>

<footer class="mt-16 bg-brand-950 text-brand-50">
  <div class="mx-auto max-w-7xl px-4 py-10 text-center sm:px-6 lg:px-8">
    <p class="text-sm text-brand-100/70">&copy; 2026 Lampung Commodity Hub. All Rights Reserved.</p>
  </div>
</footer>

<script type="module">
import { auth, db } from "./js/firebase-init.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getUserProfile, logoutUser } from "./js/auth.js";
import { fetchCompany } from "./js/data.js";

onAuthStateChanged(auth, async (user) => {
  const box = document.getElementById("navAuth");
  if (!user) {
    box.innerHTML = `
      <a class="btn-outline" href="login.html"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
      <a class="btn-primary" href="register.html"><i class="fa-solid fa-user-plus"></i> Register</a>`;
  } else {
    const p = await getUserProfile(user.uid);
    const dash = p?.role === "admin" ? "dashboard/admin.html"
              : p?.role === "superadmin" ? "dashboard/superadmin.html"
              : "dashboard/user.html";
    box.innerHTML = `
      <a class="btn-outline" href="${dash}"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
      <button id="btnLogout" class="btn-primary"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>`;
    document.getElementById("btnLogout").onclick = async () => { await logoutUser(); location.reload(); };
  }
});

try {
  const c = await fetchCompany();
  document.getElementById("contactCard").innerHTML = `
    <h2 class="font-display text-xl font-bold text-slate-900">${c.name ?? "Lampung Commodity Hub"}</h2>
    <ul class="mt-5 space-y-4 text-slate-700">
      <li class="flex items-start gap-3"><span class="grid h-10 w-10 place-items-center rounded-xl bg-brand-50 text-brand-700"><i class="fa-solid fa-location-dot"></i></span><div><p class="text-xs uppercase text-slate-500">Alamat</p><p class="font-medium">${c.address ?? "-"}</p></div></li>
      <li class="flex items-start gap-3"><span class="grid h-10 w-10 place-items-center rounded-xl bg-brand-50 text-brand-700"><i class="fa-solid fa-phone"></i></span><div><p class="text-xs uppercase text-slate-500">Telepon</p><p class="font-medium">${c.phone ?? "-"}</p></div></li>
      <li class="flex items-start gap-3"><span class="grid h-10 w-10 place-items-center rounded-xl bg-brand-50 text-brand-700"><i class="fa-regular fa-envelope"></i></span><div><p class="text-xs uppercase text-slate-500">Email</p><p class="font-medium">${c.email ?? "-"}</p></div></li>
      <li class="flex items-start gap-3"><span class="grid h-10 w-10 place-items-center rounded-xl bg-brand-50 text-brand-700"><i class="fa-brands fa-whatsapp"></i></span><div><p class="text-xs uppercase text-slate-500">WhatsApp</p><p class="font-medium">${c.whatsapp ?? "-"}</p></div></li>
    </ul>
    <div class="mt-6 flex flex-col gap-3 sm:flex-row">
      <a href="https://wa.me/${(c.whatsapp||'').replace(/[^0-9]/g,'')}" target="_blank" rel="noopener" class="inline-flex items-center justify-center gap-2 rounded-xl bg-green-600 px-5 py-3 text-sm font-semibold text-white hover:bg-green-700">
        <i class="fa-brands fa-whatsapp"></i> Hubungi via WhatsApp
      </a>
      <a href="mailto:${c.email}" class="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-300 px-5 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-50">
        <i class="fa-regular fa-envelope"></i> Email Kami
      </a>
    </div>`;
} catch (e) {
  document.getElementById("contactCard").innerHTML = `<p class="text-rose-600">${e.message}</p>`;
}

const form = document.getElementById("contactForm");
const cmsg = document.getElementById("cmsg");
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  cmsg.classList.add("hidden");
  const btn = form.querySelector("button[type=submit]");
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Mengirim…';
  try {
    await addDoc(collection(db, "inquiries"), {
      name: document.getElementById("cname").value.trim(),
      email: document.getElementById("cemail").value.trim(),
      message: document.getElementById("cmessage").value.trim(),
      status: "new",
      createdAt: serverTimestamp(),
    });
    cmsg.className = "rounded-xl bg-green-50 px-4 py-3 text-sm text-green-800";
    cmsg.textContent = "Terima kasih! Pesan Anda telah terkirim.";
    cmsg.classList.remove("hidden");
    form.reset();
  } catch (err) {
    cmsg.className = "rounded-xl bg-rose-50 px-4 py-3 text-sm text-rose-700";
    cmsg.textContent = err.message;
    cmsg.classList.remove("hidden");
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-1"></i> Kirim Pesan';
  }
});
</script>
<script src="js/app.js"></script>
</body>
</html>
