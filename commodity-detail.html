<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detail Komoditas | Lampung Commodity Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: {
      brand: { 50:'#f0fdf4',100:'#dcfce7',700:'#15803d',800:'#166534',900:'#14532d',950:'#052e16' },
      gold:  { 400:'#fbbf24',500:'#f59e0b' }
    },
    fontFamily:{ sans:['Inter','sans-serif'], display:['Poppins','sans-serif'] },
    boxShadow:{ soft:'0 6px 24px -8px rgba(15,23,42,.12)' }
  }}
}
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-white font-sans text-slate-700 antialiased">

<header class="sticky top-0 z-50 border-b border-slate-100 bg-white/90 backdrop-blur">
  <nav class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6 lg:px-8">
    <a href="index.html" class="flex items-center gap-2">
      <span class="grid h-10 w-10 place-items-center rounded-xl bg-brand-800 text-gold-400"><i class="fa-solid fa-seedling"></i></span>
      <span class="font-display text-sm font-bold text-brand-900 sm:text-base">Lampung Commodity Hub</span>
    </a>
    <button id="navToggle" class="grid h-10 w-10 place-items-center rounded-lg hover:bg-slate-100 lg:hidden" aria-label="Menu">
      <i class="fa-solid fa-bars"></i>
    </button>
    <ul id="navMenu" class="absolute left-0 right-0 top-full hidden flex-col gap-1 border-b border-slate-100 bg-white p-4 shadow-soft lg:static lg:flex lg:flex-row lg:items-center lg:border-0 lg:bg-transparent lg:p-0 lg:shadow-none">
      <li><a class="nav-link" href="index.html">Home</a></li>
      <li><a class="nav-link" href="about.html">Tentang</a></li>
      <li><a class="nav-link" href="commodities.html">Komoditas</a></li>
      <li><a class="nav-link" href="contact.html">Contact</a></li>
      <li id="navAuth" class="mt-2 flex gap-2 lg:mt-0 lg:ml-2"></li>
    </ul>
  </nav>
</header>

<main id="detail" class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
  <p class="text-slate-400">Memuat…</p>
</main>

<footer class="mt-16 bg-brand-950 text-brand-50">
  <div class="mx-auto max-w-7xl px-4 py-10 text-center sm:px-6 lg:px-8">
    <p class="text-sm text-brand-100/70">&copy; 2026 Lampung Commodity Hub. All Rights Reserved.</p>
  </div>
</footer>

<script type="module">
import { auth } from "./js/firebase-init.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getUserProfile, logoutUser } from "./js/auth.js";
import { fetchCommodityBySlug } from "./js/data.js";

onAuthStateChanged(auth, async (user) => {
  const box = document.getElementById("navAuth");
  if (!user) {
    box.innerHTML = `
      <a class="btn-outline" href="login.html"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
      <a class="btn-primary" href="register.html"><i class="fa-solid fa-user-plus"></i> Register</a>`;
  } else {
    const p = await getUserProfile(user.uid);
    const dash = p?.role === "admin" ? "dashboard/admin.html"
              : p?.role === "superadmin" ? "dashboard/superadmin.html"
              : "dashboard/user.html";
    box.innerHTML = `
      <a class="btn-outline" href="${dash}"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
      <button id="btnLogout" class="btn-primary"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>`;
    document.getElementById("btnLogout").onclick = async () => { await logoutUser(); location.reload(); };
  }
});

const slug = new URLSearchParams(location.search).get("slug");
const el = document.getElementById("detail");

if (!slug) {
  el.innerHTML = `<p class="text-rose-600">Slug komoditas tidak ditemukan.</p>`;
} else {
  try {
    const c = await fetchCommodityBySlug(slug);
    if (!c) { el.innerHTML = `<p class="text-rose-600">Komoditas tidak ditemukan.</p>`; }
    else {
      document.title = `${c.name} | Lampung Commodity Hub`;
      el.innerHTML = `
      <nav class="text-xs text-slate-500"><a href="index.html" class="hover:underline">Home</a> / <a href="commodities.html" class="hover:underline">Komoditas</a> / <span class="text-slate-700">${c.name}</span></nav>

      <div class="mt-4 grid gap-8 lg:grid-cols-2">
        <div class="overflow-hidden rounded-3xl bg-slate-100 shadow-soft ring-1 ring-slate-100">
          <img src="${c.image}" alt="Komoditas ${c.name}" class="h-full w-full object-cover" style="aspect-ratio:4/3">
        </div>
        <div>
          <span class="badge badge-green">${c.category}</span>
          <h1 class="mt-3 font-display text-3xl font-bold text-slate-900 sm:text-4xl">${c.name}</h1>
          <p class="mt-2 text-sm text-slate-500"><i class="fa-solid fa-location-dot mr-1 text-brand-700"></i>Asal: <strong>${c.origin}</strong></p>
          <p class="mt-4 text-slate-600">${c.longDescription ?? c.description ?? ""}</p>

          <dl class="mt-6 grid grid-cols-1 gap-3 sm:grid-cols-2">
            <div class="rounded-2xl bg-brand-50/60 p-4"><dt class="text-xs font-semibold uppercase text-brand-700">Jenis</dt><dd class="mt-1 text-sm text-slate-700">${c.type ?? "-"}</dd></div>
            <div class="rounded-2xl bg-brand-50/60 p-4"><dt class="text-xs font-semibold uppercase text-brand-700">Musim Panen</dt><dd class="mt-1 text-sm text-slate-700">${c.harvestSeason ?? "-"}</dd></div>
            <div class="rounded-2xl bg-brand-50/60 p-4"><dt class="text-xs font-semibold uppercase text-brand-700">Ketersediaan</dt><dd class="mt-1 text-sm text-slate-700">${c.availability ?? "-"}</dd></div>
            <div class="rounded-2xl bg-brand-50/60 p-4"><dt class="text-xs font-semibold uppercase text-brand-700">Potensi Pasar</dt><dd class="mt-1 text-sm text-slate-700">${c.marketPotential ?? "-"}</dd></div>
            <div class="rounded-2xl bg-brand-50/60 p-4 sm:col-span-2"><dt class="text-xs font-semibold uppercase text-brand-700">Status Ekspor</dt><dd class="mt-1 text-sm text-slate-700">${c.exportStatus ?? "-"}</dd></div>
          </dl>
        </div>
      </div>

      <section class="mt-12">
        <h2 class="font-display text-2xl font-bold text-slate-900">Asal Komoditas</h2>
        <p class="mt-2 text-sm text-slate-600">Wilayah produksi utama di Provinsi Lampung.</p>
        <div class="mt-6 grid gap-6 lg:grid-cols-2">
          <div class="rounded-3xl bg-gradient-to-br from-brand-900 via-brand-800 to-brand-700 p-6 shadow-soft">
            <div class="relative aspect-[4/3] w-full">
              ${(c.productionAreas || []).map((a, i) => `
                <span class="map-dot" style="left:${20 + (i*20)}%;top:${30 + (i*12)}%">
                  <i class="fa-solid fa-location-dot text-gold-500"></i>${a}
                </span>`).join("")}
            </div>
            <p class="mt-4 text-center text-xs text-brand-100/70">Placeholder peta — siap diintegrasikan dengan Leaflet/Google Maps.</p>
          </div>
          <ul class="space-y-2">
            ${(c.productionAreas || []).map(a => `
              <li class="flex items-center gap-3 rounded-2xl bg-white p-4 shadow-soft ring-1 ring-slate-100">
                <span class="grid h-9 w-9 place-items-center rounded-xl bg-gold-500/15 text-gold-600"><i class="fa-solid fa-location-dot"></i></span>
                <span class="font-medium text-slate-800">${a}</span>
              </li>`).join("")}
          </ul>
        </div>
      </section>`;
    }
  } catch (e) {
    el.innerHTML = `<p class="text-rose-600">${e.message}</p>`;
  }
}
</script>
<script src="js/app.js"></script>
</body>
</html>
